<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>创作者后台 · 停一下</title><link rel="icon" href="./icon.svg"><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./creator.css"></head>
<body><header class="header"><a class="brand" href="./" aria-label="返回停一下首页"><span class="brand-icon">Ⅱ</span><span>停一下<small>PAUSE BEFORE SCROLL</small></span></a><a href="./">返回使用页 ↗</a></header>
<main class="creator-main"><div class="page-heading"><span class="eyebrow">听见使用者的声音</span><h1>收到的反馈。</h1><p>创作者后台 · 仅持有创作者访问密钥的人可查看。</p></div>
<section id="creator-access" class="panel"><h2 id="access-heading">查看收到的反馈。</h2><p id="access-message" role="status">输入创作者访问密钥。普通使用者无需登录。</p><form id="creator-login"><label class="field">创作者访问密钥<input id="creator-key" type="password" required autocomplete="off" spellcheck="false" maxlength="128" aria-label="创作者访问密钥"></label><button class="primary" type="submit">进入反馈后台</button></form><button id="access-retry" class="secondary" hidden>重新检查</button><p class="small muted">密钥只用于本次页面访问，不会保存到浏览器。请勿分享密钥。</p></section>
<section id="creator-dashboard" hidden><div class="creator-toolbar"><p class="small muted">反馈来自网站匿名提交，不包含自动采集的观看记录。</p><button id="creator-signout" class="secondary" type="button">退出后台</button></div>
<div class="stat-grid"><div><span>全部反馈</span><strong id="feedback-total">—</strong></div><div><span>标注的技术测试</span><strong id="feedback-tests">—</strong></div><div><span>当前筛选结果</span><strong id="feedback-matching">—</strong></div></div>
<form id="creator-filter" class="panel creator-filter"><label class="field">搜索标题或内容<input id="creator-search" maxlength="100" placeholder="例如：提醒、安装、回顾"></label><label class="field">反馈类型<select id="creator-category"><option value="">全部类型</option><option>使用体验</option><option>遇到问题</option><option>功能建议</option></select></label><label class="check-row"><input id="creator-hide-tests" type="checkbox"><span>隐藏标题标注“技术测试”的记录</span></label><div class="creator-actions"><button type="submit" class="primary">搜索与刷新</button><button type="button" id="creator-reset" class="secondary">清空筛选</button></div></form>
<p id="creator-result-status" class="small muted" role="status"></p><div id="creator-list" aria-live="polite"></div><button id="creator-more" class="secondary wide" hidden>加载更早的反馈</button><p class="small muted">每次加载 20 条，按提交时间从新到旧排列。技术测试标记仅依据标题前缀，不自动判断其他反馈是否为真实体验。反馈不会公开展示，也不会自动发送给其他人。</p></section></main>
<footer class="footer"><span>停一下 · 创作者后台</span><span>让下一次修改，有据可依。</span></footer><noscript>请开启 JavaScript 以登录并查看反馈。</noscript><script type="module" src="./creator.mjs"></script></body></html>
